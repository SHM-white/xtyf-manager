name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 只在关闭时使用主分支上的可信工作流，不检出 PR 代码。
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: xtyf-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python, JS and backend
        run: |
          python -m compileall -q app.py common.py modules tests deploy/preview
          bash -n deploy/preview/setup-host.sh deploy/preview/previewctl
          for file in static/*.js; do node --check "$file"; done
          python -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
      PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          for name in PREVIEW_SSH_HOST PREVIEW_SSH_USER PREVIEW_SSH_KEY PREVIEW_SSH_KNOWN_HOSTS PREVIEW_BASE_DOMAIN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret/variable: $name"; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$HOME/.ssh/preview_key"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/preview_key" "$HOME/.ssh/known_hosts"
          echo "PREVIEW_PORT=${PREVIEW_SSH_PORT:-22}" >> "$GITHUB_ENV"
      - name: Deploy isolated PR instance
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/preview_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${PREVIEW_SSH_USER}@${PREVIEW_SSH_HOST}"
          archive="pr-${PR_NUMBER}-${GITHUB_RUN_ID}.tar.gz"
          # 只发送 Git 跟踪的文件；不会上传本地数据库、密钥或未跟踪附件。
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/source.tar.gz"
          ssh "${SSH_OPTS[@]}" -p "$PREVIEW_PORT" "$target" 'mkdir -p "$HOME/.xtyf-preview-incoming"'
          scp "${SSH_OPTS[@]}" -P "$PREVIEW_PORT" "$RUNNER_TEMP/source.tar.gz" "$target:.xtyf-preview-incoming/$archive"
          ssh "${SSH_OPTS[@]}" -p "$PREVIEW_PORT" "$target" \
            "sudo -n /usr/local/bin/xtyf-previewctl deploy $PR_NUMBER $PR_SHA \$HOME/.xtyf-preview-incoming/$archive"
          ssh "${SSH_OPTS[@]}" -p "$PREVIEW_PORT" "$target" "rm -f .xtyf-preview-incoming/$archive"
          echo "### PR preview" >> "$GITHUB_STEP_SUMMARY"
          echo "http://pr-$PR_NUMBER.$PREVIEW_BASE_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "预览需要网关访问凭据和独立测试账号；不连接生产数据库。" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preview link in PR
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
        with:
          script: |
            const marker = '<!-- xtyf-pr-preview -->';
            const url = `http://pr-${context.issue.number}.${process.env.PREVIEW_BASE_DOMAIN}`;
            const body = `${marker}\n**PR 预览已部署：** [打开测试网页](${url})\n\n- 更新本 PR 后会自动重新部署；关闭后自动删除容器和独立数据。\n- 使用服务器设置的预览访问凭据和测试账号；请勿填写真实成员、资金或发票数据。`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    # pull_request_target 仅读取受信任的默认分支工作流；不检出或执行关闭的 PR。
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
      PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
      PREVIEW_SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
      PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
      PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove instance and test data
        shell: bash
        run: |
          set -euo pipefail
          for name in PREVIEW_SSH_HOST PREVIEW_SSH_USER PREVIEW_SSH_KEY PREVIEW_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$HOME/.ssh/preview_key"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/preview_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/preview_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${PREVIEW_SSH_PORT:-22}" "${PREVIEW_SSH_USER}@${PREVIEW_SSH_HOST}" \
            "sudo -n /usr/local/bin/xtyf-previewctl delete $PR_NUMBER"
