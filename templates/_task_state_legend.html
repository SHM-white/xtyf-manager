<div class="task-tone-legend" role="group" aria-label="任务高亮图例">
  <span class="task-tone-legend-label">高亮说明</span>
  <span class="task-tone-blocked"><i aria-hidden="true"></i>阻塞</span>
  <span class="task-tone-overdue"><i aria-hidden="true"></i>逾期</span>
  <span class="task-tone-due-soon"><i aria-hidden="true"></i>3 天内截止</span>
  <span class="task-tone-dependency"><i aria-hidden="true"></i>依赖提醒</span>
  <span class="task-tone-in-progress"><i aria-hidden="true"></i>进行中</span>
  <span class="task-tone-completed"><i aria-hidden="true"></i>已完成</span>
  <span class="task-tone-not-started"><i aria-hidden="true"></i>未开始 / 已取消</span>
</div>
